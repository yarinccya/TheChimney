<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07172c">
<title>סטודיו הדמיות ארובה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b2545;
    --navy-deep: #07172c;
    --panel: #10294a;
    --line: rgba(247,241,227,.14);
    --red: #c8102e;
    --red-dark: #8f0b21;
    --cream: #f7f1e3;
    --muted: rgba(247,241,227,.66);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--navy-deep); color: var(--cream); font-family: "Heebo", Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  header { flex: none; background: var(--navy-deep); border-bottom: 3px solid var(--red);
    padding: calc(.55rem + env(safe-area-inset-top)) 16px .55rem; display: flex; justify-content: space-between; align-items: center; }
  header img { display: block; height: clamp(26px, 5vw, 36px); width: auto; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .9rem; }

  /* the one block everything happens in */
  .shell { flex: 1; min-height: 0; width: 100%; max-width: 52rem; margin: 0 auto; display: flex; flex-direction: column;
    padding: .8rem 16px calc(.8rem + env(safe-area-inset-bottom)); gap: .7rem; }
  .block { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; display: flex; flex-direction: column; }
  .step { display: none; flex: 1; min-height: 0; flex-direction: column; gap: .7rem; animation: in .35s ease; }
  .step.on { display: flex; }
  @keyframes in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  .step h2 { flex: none; font-size: 1.15rem; font-weight: 800; }
  .hint { flex: none; color: var(--muted); font-size: .9rem; line-height: 1.4; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .2rem; padding-inline-end: .2rem; }
  .fitbox { flex: 1; min-height: 0; display: grid; place-items: center; }
  .center { flex: 1; min-height: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; text-align: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 0; border-radius: 10px;
    padding: .75rem 1rem; background: rgba(247,241,227,.1); cursor: pointer; font-weight: 600; text-decoration: none; }
  .btn:hover { background: rgba(247,241,227,.18); }
  .btn.primary { background: var(--red); border-bottom: 3px solid var(--red-dark); font-weight: 800; }
  .btn.primary:hover { background: #e0173a; }
  .btn.big { padding: 1rem 1.4rem; font-size: 1.15rem; min-width: 14rem; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.on { background: var(--cream); color: var(--navy-deep); }
  .row { flex: none; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .actions { flex: none; display: flex; gap: .5rem; }
  .actions .btn { flex: 1; }
  .actions .btn.primary { flex: 2; }

  /* login */
  .login { width: min(100%, 22rem); }
  .login input { width: 100%; padding: .85rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--navy-deep); margin-bottom: .6rem; text-align: center; font-size: 1.1rem; }
  .err { color: #ff8a9a; font-size: .92rem; min-height: 1.3em; }
  .icon { font-size: 3.2rem; line-height: 1; }

  /* mark */
  .stage { position: relative; border-radius: 10px; overflow: hidden; background: #000; touch-action: none; cursor: crosshair; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage .cursor { position: absolute; pointer-events: none; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6);
    transform: translate(-50%, -50%); display: none; }
  .stage .cursor.erase { border-style: dashed; }

  /* Paint-style toolbar */
  .toolbar { flex: none; display: flex; justify-content: space-between; gap: .5rem; }
  .group { display: flex; gap: 3px; padding: 3px; background: var(--navy-deep); border: 1px solid var(--line); border-radius: 12px; }
  .tool, .size { border: 0; border-radius: 9px; background: transparent; color: var(--cream); cursor: pointer; transition: background .15s, color .15s, transform .1s; }
  .tool { display: grid; justify-items: center; gap: 2px; min-width: 3.4rem; padding: .4rem .45rem .3rem; }
  .tool svg { width: 22px; height: 22px; fill: currentColor; }
  .tool span { font-size: .72rem; font-weight: 700; }
  .tool:hover, .size:hover { background: rgba(247,241,227,.1); }
  .tool:active, .size:active { transform: scale(.92); }
  .tool.on { background: var(--red); color: #fff; box-shadow: inset 0 -3px 0 var(--red-dark); }
  .tool:disabled { opacity: .35; cursor: default; transform: none; background: transparent; }
  .tool.flash { animation: flash .45s ease; }
  @keyframes flash { 0% { background: var(--cream); color: var(--navy-deep); } 100% { background: transparent; } }
  .size { width: 2.6rem; display: grid; place-items: center; }
  .size i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: var(--cream); }
  .size.on { background: var(--cream); }
  .size.on i { background: var(--red); }
  @media (max-width: 560px) {
    .toolbar { flex-wrap: wrap; }
    .sizes { order: 3; flex: 1 1 100%; justify-content: space-around; }
    .size { flex: 1; height: 2.4rem; }
  }
  .seg { flex: none; display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .seg button { flex: 1; border: 0; padding: .6rem .5rem; background: transparent; cursor: pointer; font-weight: 600; font-size: .92rem; }
  .seg button.on { background: var(--cream); color: var(--navy-deep); }

  /* chimney */
  .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: .6rem; }
  .chim { position: relative; border: 2px solid var(--line); border-radius: 10px; background: var(--navy-deep); cursor: pointer; padding: 0; overflow: hidden; text-align: start; }
  .chim img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; }
  .chim span { display: block; padding: .4rem .5rem; font-size: .85rem; font-weight: 600; line-height: 1.25; }
  .chim.on { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
  .chim .x { position: absolute; top: .3rem; left: .3rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; }
  .thumbs { display: flex; gap: .4rem; flex-wrap: wrap; }
  .thumbs .chim { width: 3.6rem; }
  textarea, .field { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--navy-deep); padding: .65rem .8rem; }
  textarea { min-height: 3.6rem; resize: vertical; }
  .lbl { display: block; font-size: .88rem; color: var(--muted); margin: .7rem 0 .3rem; }
  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: .8rem; color: var(--muted); font-size: .9rem; }

  /* loading */
  .spinner { width: 3.2rem; height: 3.2rem; border: 4px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage-text { font-size: 1.1rem; font-weight: 700; }
  .fail { color: #ff8a9a; font-size: .95rem; max-width: 30rem; }

  /* result */
  .compare { position: relative; border-radius: 10px; overflow: hidden; background: #000; user-select: none; touch-action: none; }
  .compare canvas { display: block; width: 100%; height: 100%; }
  .compare .handle { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--cream); box-shadow: 0 0 8px rgba(0,0,0,.6); }
  .compare .handle::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 2.2rem; height: 2.2rem; border-radius: 50%;
    background: var(--cream); color: var(--navy-deep); display: grid; place-items: center; font-weight: 800; }
  .compare .tag { position: absolute; top: .5rem; padding: .15rem .5rem; border-radius: 6px; background: rgba(0,0,0,.6); font-size: .8rem; font-weight: 700; }
  .compare .tag.b { right: .5rem; } .compare .tag.a { left: .5rem; }

  @media (max-height: 640px) {
    .hint { display: none; }
    .shell { padding-top: .5rem; gap: .5rem; }
    .block { padding: .7rem; }
  }
</style>
</head>
<body>

<header>
  <img src="/logo/logo-on-navy.svg" alt="THECHIMNEYS">
  <button class="link" id="logout" hidden>יציאה</button>
</header>

<div class="shell">
  <div class="block">
    <!-- login -->
    <section class="step" data-step="login">
      <form class="center" id="loginForm">
        <div class="icon">🔒</div>
        <h2>כניסה פרטית</h2>
        <div class="login">
          <input type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" required>
          <button class="btn primary big" type="submit" style="width:100%">כניסה</button>
        </div>
        <p class="err" id="loginErr"></p>
      </form>
    </section>

    <!-- 1. photo -->
    <section class="step" data-step="1">
      <div class="center">
        <div class="icon">🏠</div>
        <h2>צלם את בית הלקוח</h2>
        <p class="hint">באור יום, כשכל הגג נראה בבירור.</p>
        <label class="btn primary big">📷 צלם עכשיו<input type="file" accept="image/*" capture="environment" id="camInput" hidden></label>
        <label class="btn big">🖼️ בחר מהגלריה<input type="file" accept="image/*" id="galInput" hidden></label>
      </div>
    </section>

    <!-- 2. mark -->
    <section class="step" data-step="2">
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="add" class="on">אין ארובה – להוסיף</button>
        <button type="button" data-mode="replace">יש ארובה ישנה – להחליף</button>
      </div>
      <p class="hint" id="markHint">צבע באצבע את המקום על הגג שבו תעמוד הארובה.</p>
      <div class="fitbox"><div class="stage" id="stage"><canvas id="view"></canvas><div class="cursor" id="cursor"></div></div></div>
      <div class="toolbar">
        <div class="group">
          <button class="tool on" type="button" id="toolBrush" aria-pressed="true">
            <svg viewBox="0 0 24 24"><path d="M18.4 2.6a2 2 0 0 1 2.9 2.8l-8.6 9.4-3.4-3.4z"/><path d="M8.2 12.4l3.4 3.4c-.3 3-2.6 5.2-6.6 5.2-1.2 0-2.3-.3-3-.8 1.6-.6 2-1.8 2.2-3.2.3-2.6 1.6-4.4 4-4.6z"/></svg>
            <span>מברשת</span>
          </button>
          <button class="tool" type="button" id="toolEraser" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M15.1 3.3a2 2 0 0 1 2.8 0l4.8 4.8a2 2 0 0 1 0 2.8L12.4 21H20v2H8.6l-6.3-6.3a2 2 0 0 1 0-2.8zM9 9.4l-5.3 5.3 5.9 5.9h1.9l3.4-3.4z"/></svg>
            <span>מחק</span>
          </button>
        </div>
        <div class="group sizes" id="sizes" aria-label="עובי">
          <button class="size" type="button" data-size="2.5"><i style="--d:6px"></i></button>
          <button class="size on" type="button" data-size="4.5"><i style="--d:11px"></i></button>
          <button class="size" type="button" data-size="7"><i style="--d:16px"></i></button>
          <button class="size" type="button" data-size="11"><i style="--d:22px"></i></button>
        </div>
        <div class="group">
          <button class="tool" type="button" id="undo">
            <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.7 0-5.1 1-7 2.6L2 7v9h9l-3.6-3.6c1.4-1.2 3.2-1.9 5.1-1.9 3.5 0 6.5 2.3 7.6 5.5l2.4-.8C21 11 17.1 8 12.5 8z"/></svg>
            <span>ביטול</span>
          </button>
          <button class="tool" type="button" id="clear">
            <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7zm4 2v8h1.5v-8zm2.5 0v8H14v-8z"/></svg>
            <span>נקה</span>
          </button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="button" data-go="1">→ תמונה אחרת</button>
        <button class="btn primary" type="button" id="markNext" disabled>המשך ←</button>
      </div>
    </section>

    <!-- 3. chimney -->
    <section class="step" data-step="3">
      <h2>בחר ארובה</h2>
      <div class="scroll">
        <div class="catalog" id="catalog"></div>
        <p class="lbl">או העלה תמונות של הארובה (עד 6 זוויות)</p>
        <div class="row">
          <label class="btn">⬆️ העלאת תמונות<input type="file" accept="image/*" multiple id="refInput" hidden></label>
          <div class="thumbs" id="refThumbs"></div>
        </div>
        <label class="lbl" for="desc">תיאור הארובה (חומר, צבע, קוטר, כובע)</label>
        <input class="field" id="desc" placeholder="לדוגמה: נירוסטה מוברשת, קוטר 20 ס״מ, כובע קוני">
        <label class="lbl" for="notes">הערות (לא חובה)</label>
        <textarea id="notes" placeholder="לדוגמה: גובה כ-1.5 מטר מעל הגג"></textarea>
      </div>
      <div class="actions">
        <button class="btn" type="button" data-go="2">→ חזרה</button>
        <button class="btn primary" type="button" id="go" disabled>✨ צור הדמיה</button>
      </div>
    </section>

    <!-- 4. working -->
    <section class="step" data-step="4">
      <div class="center" id="working">
        <div class="spinner"></div>
        <div class="stage-text" id="stageText">בונה ארובה…</div>
        <div class="hint"><span id="timer">0</span> שניות · בדרך כלל 1–2 דקות</div>
      </div>
      <div class="center" id="failed" hidden>
        <div class="icon">⚠️</div>
        <p class="fail" id="failText"></p>
        <button class="btn primary" type="button" data-go="3">→ חזרה ונסה שוב</button>
      </div>
    </section>

    <!-- 5. result -->
    <section class="step" data-step="5">
      <div class="fitbox" id="resultBox"></div>
      <div class="actions">
        <button class="btn" type="button" id="restart">🔄 חדש</button>
        <button class="btn primary" type="button" id="download">⬇️ הורדה</button>
      </div>
    </section>
  </div>
</div>

<script src="/studio/chimneys/catalog.js"></script>
<script src="/studio/app.js"></script>
</body>
</html>
